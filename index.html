<!DOCTYPE html>
<html lang="bn">
<head> 
    <meta charset="UTF-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>দারুত্তাকওয়া হাফিজুল কুরআন মাদ্রাসা</title> 
   
    <!-- ফেভিকন আইকন --> 
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1BC9yDZx-LEVp1pb0qkm3ue4yPq382PZl=w1000" />
    <link href="https://fonts.googleapis.com/css2?family=SolaimanLipi&display=swap" rel="stylesheet" />
    
    <style> 
        * { 
            box-sizing: border-box; 
            font-family: 'SolaimanLipi', sans-serif !important; 
        }
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            background: #0f172a; 
        }
        
        /* মেইন কনটেইনার ও আইফ্রেম */
        .main-container { 
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #0f172a;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
            background-color: #0f172a; 
        }
    </style>
</head>
<body>

    <div class="main-container"> 
        <iframe src="https://sites.google.com/view/daruttaqwahuffazulquranmadrasa/"></iframe>
    </div>

</body>
</html>
